name: Update Klondike Mercantile data

on:
  schedule:
    # Every 3 hours - safe now that each run only fully processes a
    # bounded batch (new candidates + BATCH_SIZE known ones from a
    # rotation) instead of the whole list at once, see BATCH_SIZE
    # and main()'s docstring in generate_klondike_data.py. A weekly
    # cron with a full sweep per run kept hitting real rate-limit
    # trouble once README/setup-section/locale-listing calls were
    # added per candidate; smaller, more frequent runs stay well
    # within budget while still cycling the whole known list roughly
    # every 356/60 ≈ 6 runs ≈ ~18 hours, and catching new repos every
    # single run regardless of rotation position.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      # Only re-run on push when WHAT gets fetched could have
      # changed - not on every push. Pure frontend changes are
      # handled by the separate, much cheaper deploy-static.yml.
      - "scripts/generate_klondike_data.py"

# Queues (not cancels) overlapping runs - several script-changing
# pushes landed back-to-back in one session and each auto-triggered
# its own ~15-20 min run; without this, two runs finishing close
# together could both try to commit/push data at once and conflict.
# Deliberately NOT cancel-in-progress: a run that's already invested
# 15+ minutes of real API calls shouldn't be thrown away just
# because a newer push arrived - it should finish, then the next one
# starts from a clean checkout.
concurrency:
  group: update-mercantile-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Klondike data
        env:
          # Same minimal-scope PAT pattern as andlo/ovos-skills-directory -
          # "Public Repositories (read-only)", nothing broader. This
          # step only ever reads public repos/code/files across
          # GitHub - it has no reason to hold write access anywhere.
          GH_TOKEN: ${{ secrets.PUBLIC_READ_TOKEN }}
        run: python3 scripts/generate_klondike_data.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/ docs/skills.json docs/meta.json state.json
          git diff --cached --quiet || git commit -m "chore: update Klondike data [automated]"
          git push

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull latest (in case generate job committed)
        run: git pull
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
